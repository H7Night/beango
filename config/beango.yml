# Beango Configuration
# 所有运行参数均从本文件读取，代码中不写死路径/端口/账户
beango:
  outputFolder: "./test/out" # 输出根目录（转换输出、中间文件与日志均在此）
  defaultFolder: "0-default" # 普通交易子目录
  securitFolder: "1-securities" # 证券交易子目录
  serverPort: "10777" # Web 服务端口
  webDir: "./web/dist" # 前端静态资源目录
  configFolder: "./config" # 配置文件目录（account_map.yml 等存放于此）
  accountMapFile: "account_map.yml" # 账户映射文件名
  commodityMapFile: "commodity_map.yml" # 商品映射文件名
  defaultExpenseAccount: "Expenses:Other" # 未匹配交易支出兜底账户
  defaultIncomeAccount: "Income:Other" # 未匹配交易收入兜底账户
  defaultAssetAccount: "Assets:Other" # 未匹配交易资产/负债兜底账户
